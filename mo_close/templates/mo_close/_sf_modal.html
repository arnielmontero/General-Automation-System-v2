{# Yes / No popup for the SF-Innova / SF-Electrical checkmarks (static/js/sf-done.js). #}
<div class="modal fade" id="sf-modal" tabindex="-1" aria-labelledby="sf-modal-title" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title fs-6 fw-semibold" id="sf-modal-title"></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p class="mb-0" id="sf-modal-message"></p>
        <div class="mt-3 d-none" id="sf-modal-comment-wrap">
          <label class="form-label small fw-semibold" for="sf-modal-comment">Reason for unchecking (required)</label>
          <textarea class="form-control" id="sf-modal-comment" rows="3"></textarea>
          <div class="invalid-feedback">Enter the reason — it is saved in the log and shown on the row.</div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-soft btn-sm" data-bs-dismiss="modal">No</button>
        <button type="button" class="btn btn-primary btn-sm" id="sf-modal-yes">Yes</button>
      </div>
    </div>
  </div>
</div>
